name: ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src app.py scripts

      - name: Run test suite
        run: pytest -q

      - name: Regenerate synthetic evaluation data
        run: python scripts/generate_sample_data.py

      - name: Run reproducible evaluation
        run: python scripts/run_evaluation.py --embedding-backend hashing

      - name: Verify annotation agreement and adjudication
        run: |
          python scripts/evaluate_annotation_agreement.py
          python scripts/adjudicate_relevance_labels.py

      - name: Run real-JD evaluation
        run: python scripts/run_real_evaluation.py --embedding-backend hashing

      - name: Verify SQLite import
        run: python scripts/import_jobs.py --input data/evaluation/jobs.json --db data/ci.db

      - name: Upload evaluation result
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            data/evaluation/results.json
            data/real_jobs/annotation_agreement.json
            data/real_jobs/annotation_disagreements.json
            data/real_jobs/evaluation_results.json
            data/real_jobs/relevance_gold.json
          retention-days: 14
