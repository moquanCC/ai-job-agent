[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-agent"
version = "0.1.0"
description = "Explainable AI job matching and grounded resume optimization for Shanghai graduates"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.36",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*"]
